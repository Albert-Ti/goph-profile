name: goph-profile

services:
  postgres:
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql
    depends_on:
      - seaweedfs-s3

  adminer:
    image: adminer
    restart: always
    ports:
      - 5050:8080
    depends_on:
      - postgres

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - 8333:8333
      - 9333:9333
      - 8888:8888 # Визуальный просмотр файлов в браузере
    volumes:
      - seaweedfs-data:/data
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        echo '{
          "identities": [
            {"name": "anonymous", "actions": ["Read"]},
            {
              "name": "goph-profile",
              "credentials": [{"accessKey": "${OBJ_STORAGE_ACCESS_KEY}", "secretKey": "${OBJ_STORAGE_SECRET_KEY}"}],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            }
          ]
        }' > /etc/seaweedfs/config.json && \
        weed -config_dir=/etc/seaweedfs server -s3 -s3.config /etc/seaweedfs/config.json

  server:
    build:
      dockerfile: Dockerfile.server
      target: dev
    restart: on-failure
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS}
      DB_CONN_STRING: ${DB_CONN_STRING}
      OBJ_STORAGE_ADDR: ${OBJ_STORAGE_ADDR}
      OBJ_STORAGE_ACCESS_KEY: ${OBJ_STORAGE_ACCESS_KEY}
      OBJ_STORAGE_SECRET_KEY: ${OBJ_STORAGE_SECRET_KEY}
      OBJ_STORAGE_BUCKET: ${OBJ_STORAGE_BUCKET}
      MIGRATIONS_PATH: 'file:///app/migrations'
    depends_on:
      - postgres

  client:
    build:
      dockerfile: Dockerfile.client
    depends_on:
      - server

  nginx:
    build:
      dockerfile: Dockerfile.nginx
    ports:
      - 80:80
    depends_on:
      - client

volumes:
  pg-data: {}
  seaweedfs-data: {}
